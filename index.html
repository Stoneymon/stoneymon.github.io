    <script src="assets/js/creative.js"></script>
    <script>
        function changeLanguage(lang) {
          location.hash = lang;
          location.reload();
        }

        var language = {
          ger: {
            about: "Über uns",
            food: "Essen",
            contact: "Kontakt",
            languageToggle: "Sprache",
            cousine: "Arabische Küche",
            findOut: "Entdecken Sie mehr",
            discover: "Entdecken Sie unsere Speisekarte",
            ingredients: "Frische Zutaten, die täglich von unserem hochqualifizierten Küchenteam zubereitet werden",
            menu: "Speisekarte",
            getInTouch: "Kontaktieren Sie uns!"
          },
           
           ara: {
            about: "عنا",
            food: "الطعام",
            contact: "التواصل",
            languageToggle: "اللغة",
            cousine: "مطبخ عربي",
            findOut: "إكتشف أكثر",
            discover: "اكتشف قائمة الطعام",
            ingredients: "يتم تحضير الطعام الطازج يوميا من قبل طاقم المطبخ ذو الخبرة",
            menu: "قائمة الطعام",
            getInTouch: "اتصل بنا"
          }
        };
        
      
        if (window.location.hash) {
          if (window.location.hash == "#ger") {
            ab.textContent = language.ger.about;
            food.textContent = language.ger.food;
            cont.textContent = language.ger.contact;
            navbarDarkDropdownMenuLink.textContent = language.ger.languageToggle;
            cousine.textContent = language.ger.cousine;
            findOut.textContent = language.ger.findOut;
            discover.textContent = language.ger.discover;
            ingredients.textContent = language.ger.ingredients;
            menu.textContent = language.ger.menu;
            getInTouch.textContent = language.ger.getInTouch;
          }
          else if (window.location.hash == "#ara") {
            ab.textContent = language.ara.about;
            food.textContent = language.ara.food;
            cont.textContent = language.ara.contact;
            language.textContent = language.ara.language;
            cousine.textContent = language.ara.cousine;
            discover.textContent = language.ara.discover;
            ingredients.textContent = language.ara.ingredients;
            menu.textContent = language.ara.menu;
            getInTouch.textContent = language.ara.getInTouch;
          }
        }
      </script>
